<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日單字 Daily Words</title>
  <style>
    :root { --primary: #2563eb; --bg: #f8fafc; --card: #ffffff; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: #1e293b; max-width: 680px; margin: 40px auto; padding: 0 16px; line-height: 1.6; }
    h1 { text-align: center; font-size: 1.8rem; margin-bottom: 8px; }
    .date-badge { text-align: center; color: #64748b; font-size: 0.95rem; margin-bottom: 24px; }
    .card-list { display: flex; flex-direction: column; gap: 20px; }
    .card { background: var(--card); border-radius: 16px; padding: 22px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.06), 0 2px 4px -2px rgba(0,0,0,0.06); border: 1px solid #e2e8f0; }
    .header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
    .word { font-size: 1.8rem; font-weight: 700; color: var(--primary); }
    .phonetic { color: #64748b; font-size: 0.95rem; }
    .pos { color: #0284c7; font-weight: 600; font-size: 0.85rem; }
    .speak-btn { background: #eff6ff; border: none; border-radius: 50%; width: 32px; height: 32px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; }
    .speak-btn:hover { background: #dbeafe; }
    .def-zh { font-size: 1.15rem; font-weight: 600; margin-bottom: 6px; }
    .def-en { color: #475569; margin-bottom: 14px; font-size: 0.95rem; }
    .example-box { background: #f1f5f9; border-left: 4px solid var(--primary); padding: 10px 14px; border-radius: 0 8px 8px 0; margin-bottom: 12px; font-size: 0.95rem; }
    .tip { font-size: 0.85rem; color: #64748b; background: #fffbeb; padding: 8px 12px; border-radius: 6px; border: 1px solid #fef3c7; }
    .history-title { margin-top: 40px; font-size: 1.1rem; color: #334155; font-weight: 600; }
    .history-item { padding: 10px 0; border-bottom: 1px dashed #cbd5e1; font-size: 0.92rem; }
  </style>
</head>
<body>
  <h1>📘 每日 5 個精選單字</h1>
  <div class="date-badge" id="today-date"></div>
  <div id="content">載入單字中...</div>

  <script>
    fetch('data/words.json')
      .then(res => res.json())
      .then(list => {
        if (!list || list.length === 0) {
          document.getElementById('content').innerHTML = '<p style="text-align:center;">目前尚無單字資料，請執行一次生成流程。</p>';
          return;
        }

        // 取出最新的 5 個單字作為今日單字
        const todayWords = list.slice(0, 5);
        // 第 6 個之後歸類為歷史單字
        const historyWords = list.slice(5);

        if (todayWords.length > 0 && todayWords[0].date) {
          document.getElementById('today-date').innerText = `📅 更新日期：${todayWords[0].date}`;
        }

        let html = '<div class="card-list">';

        todayWords.forEach((item, index) => {
          html += `
            <div class="card">
              <div class="header">
                <span class="word">${item.word}</span>
                <span class="phonetic">${item.phonetic || ''}</span>
                <span class="pos">[${item.part_of_speech || ''}]</span>
                <button class="speak-btn" onclick="speak('${item.word}')" title="點擊發音">🔊</button>
              </div>
              <div class="def-zh">${item.definition_zh || ''}</div>
              <div class="def-en">${item.definition_en || ''}</div>
              <div class="example-box">
                <div>${item.example_en || ''}</div>
                <div style="color: #64748b; font-size: 0.9em; margin-top: 4px;">${item.example_zh || ''}</div>
              </div>
              <div class="tip">💡 記憶提示：${item.etymology_tip || ''}</div>
            </div>
          `;
        });

        html += '</div>';

        if (historyWords.length > 0) {
          html += '<div class="history-title">📚 歷史單字回顧</div><div>';
          historyWords.forEach(item => {
            html += `
              <div class="history-item">
                <span style="color:#64748b; font-size: 0.85em;">${item.date || ''}</span> · 
                <strong>${item.word}</strong> (${item.part_of_speech || ''}): ${item.definition_zh || ''}
              </div>
            `;
          });
          html += '</div>';
        }

        document.getElementById('content').innerHTML = html;
      })
      .catch(err => {
        document.getElementById('content').innerHTML = '<p style="text-align:center; color:red;">讀取資料失敗，請確認 data/words.json 是否存在。</p>';
      });

    function speak(text) {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      window.speechSynthesis.speak(u);
    }
  </script>
</body>
</html>
